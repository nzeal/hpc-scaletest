# ============================================================================
# HPC-ScaleTest Generic Configuration Template
# ============================================================================
# This is a complete template showing all available configuration options.
# Copy this file and customize for your specific application and HPC system.
# Usage: python hpc_auto.py --config my_config.yaml
# ============================================================================

# ----------------------------------------------------------------------------
# SOURCE CONFIGURATION (REQUIRED)
# ----------------------------------------------------------------------------
# Specify either a local path or a Git repository URL
repository: /path/to/your/application
# repository: https://github.com/username/your-hpc-app.git

# Optional: Specific branch or tag to checkout
# branch: main
# tag: v1.0.0

# ----------------------------------------------------------------------------
# SCALING CONFIGURATION
# ----------------------------------------------------------------------------
# Type of scaling test: 'strong' or 'weak'
scaling: strong

# Maximum number of nodes to test
# The framework will generate a power-of-2 sequence: 1, 2, 4, 8, ..., up to this value
nodes: 16

# Scaling factor for progression (default: 2.0 for doubling)
scaling_factor: 2.0

# Scaling dimensions: 2 or 3
# - 2D: Scale in X→Y pattern (Z remains constant)
# - 3D: Scale in X→Y→Z pattern (all dimensions scale)
scaling_dimensions: 3

# Initial processor decomposition (px, py, pz)
# This defines the MPI rank distribution in 3D space
initial_procs: [2, 2, 2]  # Total: 8 processes

# For WEAK SCALING only: specify initial problem size
# Initial domain size (Lx, Ly, Lz) - physical domain dimensions
initial_domain: [10.0, 10.0, 10.0]

# Initial cell count (nx, ny, nz) - grid resolution
initial_cells: [128, 128, 128]

# Optional: Particles per cell for particle-based simulations
# particles_per_cell:
#   x: 10
#   y: 10
#   z: 10

# ----------------------------------------------------------------------------
# VARIABLE MAPPING (For generic input file parsing)
# ----------------------------------------------------------------------------
# Maps framework parameters to your application's input file variable names
# Customize these to match your input file format
variable_map:
  length:
    x: "Lx"      # Variable name for X-dimension length
    y: "Ly"      # Variable name for Y-dimension length
    z: "Lz"      # Variable name for Z-dimension length
  cells:
    x: "nx"      # Variable name for X-dimension cell count
    y: "ny"      # Variable name for Y-dimension cell count
    z: "nz"      # Variable name for Z-dimension cell count
  mpi_decomposition:
    x: "npx"     # Variable name for X-dimension MPI processes
    y: "npy"     # Variable name for Y-dimension MPI processes
    z: "npz"     # Variable name for Z-dimension MPI processes
  # Optional: particle variables
  # particles:
  #   x: "npcelx"
  #   y: "npcely"
  #   z: "npcelz"

# ----------------------------------------------------------------------------
# HARDWARE CONFIGURATION
# ----------------------------------------------------------------------------
# Hardware type: 'cpu' or 'gpu'
hardware: cpu

# Processors per node (must match your hardware configuration)
procs_per_node: 128  # Example: 2x AMD EPYC 64-core processors

# For GPU systems:
# gpus_per_node: 4
# gpu_type: "A100"

# ----------------------------------------------------------------------------
# RESOURCE CONFIGURATION
# ----------------------------------------------------------------------------
# Partition/queue name for job submission
partition: compute

# Optional: QoS (Quality of Service) specification
# qos: normal

# Optional: Multi-tier QoS mapping for automatic selection based on node count
# qos_mapping:
#   small:
#     max_nodes: 16
#     qos: "normal"
#   large:
#     min_nodes: 17
#     max_nodes: 128
#     qos: "large_qos"

# Account/project allocation (required on many systems)
account: your_project_account

# Time limit for each job (HH:MM:SS format)
time_limit: "01:00:00"

# Optional: Memory per node (in GB or MB)
# memory: "128GB"

# Optional: Additional SLURM options
# slurm_options:
#   - "--constraint=skylake"
#   - "--exclusive"

# ----------------------------------------------------------------------------
# ENVIRONMENT & MODULES
# ----------------------------------------------------------------------------
# List of environment modules to load before compilation and execution
modules:
  - compiler/gcc/11.2.0
  - mpi/openmpi/4.1.1
  # - cuda/11.8  # For GPU builds
  # - hdf5/1.12.0

# Optional: Environment variables to set
# environment:
#   OMP_NUM_THREADS: "1"
#   UCX_TLS: "rc,ud,sm,self"

# ----------------------------------------------------------------------------
# BUILD CONFIGURATION
# ----------------------------------------------------------------------------
# Build system: 'cmake', 'make', 'autotools', 'spack', 'easybuild'
# If not specified, the framework will attempt auto-detection
build_system: make

# Build flags/options (system-specific)
# build_flags:
#   CMAKE_BUILD_TYPE: "Release"
#   CMAKE_CXX_FLAGS: "-O3 -march=native"
# 
# For make:
# build_flags:
#   CC: "gcc"
#   CXX: "g++"
#   CFLAGS: "-O3 -march=native"

# Parallel build jobs
# parallel_jobs: 8

# Skip building if executable already exists
no_build: false

# Build directory (for out-of-source builds)
# build_dir: build

# ----------------------------------------------------------------------------
# INPUT FILE CONFIGURATION
# ----------------------------------------------------------------------------
# Path to input file or directory containing input files
# Relative to repository root
input_file: input.dat

# If input_file is a directory, specify the file name
# input_name: simulation.inp

# Optional: Output directory for results
# output_dir: results

# ----------------------------------------------------------------------------
# EXECUTION CONFIGURATION
# ----------------------------------------------------------------------------
# Command to execute (relative to repository root)
# If not specified, the framework attempts auto-detection
# command: ./bin/simulation

# Command-line arguments for the executable
# command_args:
#   - "--verbose"
#   - "--output=results"

# ----------------------------------------------------------------------------
# SCHEDULER & LAUNCHER CONFIGURATION
# ----------------------------------------------------------------------------
# Job scheduler: 'slurm', 'pbs', 'local'
# Auto-detected if not specified
scheduler: slurm

# MPI launcher: 'srun', 'mpirun', 'mpiexec'
# Auto-selected based on scheduler if not specified
launcher: srun

# Module system: 'lmod', 'tmod', 'tmod4', 'nomod'
# Auto-detected if not specified
module_system: lmod

# Optional: Custom launcher options
# launcher_options:
#   - "--cpu-bind=cores"
#   - "--distribution=block:block"

# ----------------------------------------------------------------------------
# SYSTEM CONFIGURATION (Alternative to manual settings)
# ----------------------------------------------------------------------------
# Use predefined system configuration file
# system_config: leonardo_system.py
# partition_name: booster

# Use custom launcher from system config
# use_custom_launcher: mpirun-optimized

# ----------------------------------------------------------------------------
# BEHAVIOR CONFIGURATION
# ----------------------------------------------------------------------------
# Enable verbose logging
verbose: true

# Automatically submit jobs after generation
# Set to false to only generate job scripts without submission
auto_submit: true

# Dry run mode: prepare everything but don't execute
# dry_run: false

# Disable LLM-based discovery (use generic parser only)
use_llm_discovery: false

# Continue on errors (for batch processing)
# continue_on_error: false

# Clean build directory before compilation
# clean_build: false

# ----------------------------------------------------------------------------
# OUTPUT & REPORTING CONFIGURATION
# ----------------------------------------------------------------------------
# Generate performance report after completion
generate_report: true

# Report format: 'text', 'json', 'both'
report_format: both

# Export raw timing data
# export_timings: true

# Generate visualization plots (requires matplotlib)
# generate_plots: false

# ----------------------------------------------------------------------------
# VALIDATION & TESTING
# ----------------------------------------------------------------------------
# Run validation tests after each scaling step
# validate_results: false

# Timeout for individual jobs (in minutes)
# job_timeout: 60

# Maximum number of retry attempts for failed jobs
# max_retries: 2
